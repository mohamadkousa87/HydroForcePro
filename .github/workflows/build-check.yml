name: Build Check

# Compiles the app on every push to main (and manual runs) WITHOUT releasing.
# Catches Kotlin/compile errors early, before a release tag is pushed — no signing,
# no GitHub Release, no APK published. Release builds stay in release.yml (tags only).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Avoid piling up runs: a newer push cancels an in-progress check.
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile (assembleDebug)
        run: ./gradlew assembleDebug --no-daemon
